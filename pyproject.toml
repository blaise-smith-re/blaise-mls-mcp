[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mls-mcp"
version = "0.1.0"
description = "MCP server for MLS listing data over the RESO Web API (OData)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
mls-mcp = "mls_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mls_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
